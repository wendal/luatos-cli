[package]
name = "luatos-flash"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LuatOS flash protocols — BK7258, EC618, etc."

[features]
# SF32LB 系列默认全部关闭（可裁剪约 2.4MB 内嵌 RAM stub 数据与协议代码）。
# 刷机功能只需：--features sf32lb58
# （luatos-soc 把 sf32lb52~58 全部映射到 Sf32lb58 族，刷机实现固定使用 SF32LB58；
#   sf32lb52/55/56/57 仅内嵌对应型号的 stub 数据，供外部工具使用）
default = []
sf32lb52 = ["dep:sftool-lib", "sftool-lib/sf32lb52"]
sf32lb55 = ["dep:sftool-lib", "sftool-lib/sf32lb55"]
sf32lb56 = ["dep:sftool-lib", "sftool-lib/sf32lb56"]
sf32lb57 = ["dep:sftool-lib", "sftool-lib/sf32lb57"]
sf32lb58 = ["dep:sftool-lib", "sftool-lib/sf32lb58"]

[dependencies]
luatos-soc = { path = "../luatos-soc" }
luatos-luadb = { path = "../luatos-luadb" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
log.workspace = true
zip.workspace = true
tempfile = "3"
walkdir.workspace = true
md5 = "0.7"
sha2.workspace = true
crc32fast = "1"
sevenz-rust2.workspace = true
sftool-lib = { git = "https://github.com/wendal/sftool", branch = "remove-probe-rs-dep", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Devices_Communication",
] }
