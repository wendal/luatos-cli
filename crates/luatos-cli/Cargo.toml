[package]
name = "luatos-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LuatOS CLI tool — flash, log, project management"

[[bin]]
name = "luatos-cli"
path = "src/main.rs"

[features]
default = ["sf32lb52", "sf32lb55", "sf32lb56", "sf32lb57", "sf32lb58"]
sf32lb52 = ["luatos-flash/sf32lb52"]
sf32lb55 = ["luatos-flash/sf32lb55"]
sf32lb56 = ["luatos-flash/sf32lb56"]
sf32lb57 = ["luatos-flash/sf32lb57"]
sf32lb58 = ["luatos-flash/sf32lb58"]

[dependencies]
luatos-soc = { path = "../luatos-soc" }
luatos-luadb = { path = "../luatos-luadb" }
luatos-flash = { path = "../luatos-flash", default-features = false }
luatos-serial = { path = "../luatos-serial" }
luatos-project = { path = "../luatos-project" }
luatos-log = { path = "../luatos-log" }
luatos-resource = { path = "../luatos-resource" }
luatos-testcase = { path = "../luatos-testcase" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
env_logger.workspace = true
log.workspace = true
ctrlc = "3"
serialport.workspace = true
toml.workspace = true
chrono.workspace = true
tempfile.workspace = true
ureq = { workspace = true }
walkdir.workspace = true
dialoguer = { workspace = true }
indicatif = { workspace = true }
